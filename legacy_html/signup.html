<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Outside the Lines</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================= BACKGROUND ================= -->

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>



    <!-- ================= SIGNUP PAGE ================= -->

    <main class="auth-page">


        <div class="auth-card">


            <!-- Logo -->

            <a
                href="index.html"
                class="auth-logo"
            >
                Outside the Lines
            </a>


            <p class="auth-subtitle">
                Because everyone's journey is different.
            </p>



            <!-- Heading -->

            <h1>
                Create your account
            </h1>


            <p class="auth-description">
                Let's start building a journey
                that works for you.
            </p>



            <!-- Signup Form -->

            <form id="signup-form">


                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>



                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- Submit -->

                <button
                    type="submit"
                    class="primary-btn auth-submit"
                >
                    Create Account →
                </button>


            </form>



            <!-- Login -->

            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>



            <!-- Back -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>

    </main>



    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
